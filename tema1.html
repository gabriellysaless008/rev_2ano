<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filosofia</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a class="botaoVoltar" href="index.html"> Voltar </a>

      <h1>Filosofia</h1>

      <p>As redações da turma</p>
    </header>

    <main>
      <!-- REDAÇÕES CARREGADAS PELO FIREBASE -->

      <section id="listaRedacoes"></section>
    </main>
    <!-- BOTÃO ADD -->
    <button id="btnNovaRedacao" class="btn-add">
      <span class="plus-icon">+</span>
      <span>Nova Redação</span>
    </button>
    <!-- MODAL DE CADASTRO -->

    <div id="modalRedacao" class="modal">
      <div class="modal-content">
        <span id="fecharModal" class="fechar"> &times; </span>

        <h2>Nova Redação</h2>

        <form id="formRedacao">
          <label for="autor"> Autor </label>

          <input placeholder="Nome Completo" type="text" id="autor" required />

          <label  for="email"> Email </label>

          <input placeholder="Seu email @escola.pr.gov.br" type="email" id="email" required />

          <label for="titulo"> Título </label>

          <input placeholder="Título da Redação" type="text" id="titulo" required />

          <label for="texto"> Texto </label>

          <textarea placeholder="Digite o conteúdo da redação aqui..." id="texto" rows="10" required></textarea>

          <button class="botao" type="submit">Enviar Redação</button>
        </form>
      </div>
    </div>

    <!-- MODAL DE LEITURA -->

    <div id="modalLeitura" class="modal">
      <div class="modal-content">
        <span id="fecharLeitura" class="fechar"> &times; </span>

        <h2 id="tituloRedacao" class="titulo-redacao"></h2>

        <div id="textoRedacao" class="texto-redacao"></div>

        <p id="autorRedacao" class="autor-redacao"></p>
      </div>
    </div>

  </body>
</html>
