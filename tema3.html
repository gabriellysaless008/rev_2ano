<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Literatura</title>

    <link rel="stylesheet" href="css/literatura.css">

</head>


<body class="pagina-literatura">


<header class="literatura-header">

    <div class="literatura-header-inner">

        <a
            class="literatura-voltar"
            href="index.html"
        >
            ← Voltar
        </a>


        <div class="literatura-marca">

            <div class="literatura-icone">
                L
            </div>

            <div>

                <strong>
                    Literatura
                </strong>

                <small>
                    REDAÇÕES DA TURMA
                </small>

            </div>

        </div>

    </div>

</header>


<main class="literatura-main">

    <div class="literatura-container">


        <div class="literatura-intro">

            <span>
                LITERATURA
            </span>

            <h1>
                Redações da turma
            </h1>

            <p>
                Redações produzidas pelos alunos durante as atividades de Literatura.
            </p>

        </div>


        <!-- ==================================================
             CARROSSEL DE TRABALHOS
        =================================================== -->

        <section
            class="trabalhos-secao"
            id="secaoTrabalhos"
        >

            <div class="trabalhos-titulo">

                <span>
                    PROJETOS
                </span>

                <h2>
                    Trabalhos da turma
                </h2>

                <p>
                    Registros dos trabalhos realizados pelos alunos durante as atividades.
                </p>

            </div>


            <div class="trabalhos-carrossel">

                <button
                    id="btnTrabalhoAnterior"
                    class="btn-trabalho"
                    type="button"
                    aria-label="Trabalho anterior"
                >
                    ←
                </button>


                <div class="trabalhos-viewport">

                    <div
                        id="trabalhosTrack"
                        class="trabalhos-track"
                    ></div>

                </div>


                <button
                    id="btnTrabalhoProximo"
                    class="btn-trabalho"
                    type="button"
                    aria-label="Próximo trabalho"
                >
                    →
                </button>

            </div>


            <div
                id="trabalhosIndicadores"
                class="trabalhos-indicadores"
            ></div>

        </section>


    </div>

</main>



<!-- ==================================================
     MODAL - LEITURA DA REDAÇÃO
=================================================== -->

<div
    id="modalLeitura"
    class="literatura-modal"
>

    <div
        class="literatura-modal-content literatura-leitura"
    >

        <button
            id="fecharLeitura"
            class="literatura-fechar"
            type="button"
            aria-label="Fechar"
        >
            &times;
        </button>


        <h2
            id="tituloRedacao"
            class="titulo-redacao"
        ></h2>


        <div
            id="textoRedacao"
            class="texto-redacao"
        ></div>


        <p
            id="autorRedacao"
            class="autor-redacao"
        ></p>

    </div>

</div>



<script type="module" src="js/literatura.js"></script>


</body>

</html>
