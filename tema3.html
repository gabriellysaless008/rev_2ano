<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Literatura</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-literatura">

    <!-- ==================================================
         CABEÇALHO
    =================================================== -->

    <header class="literatura-header">

        <div class="literatura-header-inner">

            <a
                class="literatura-voltar"
                href="index.html"
            >
                ← Voltar
            </a>

            <div class="literatura-marca">

                <div class="literatura-icone">
                    L
                </div>

                <div>
                    <strong>Literatura</strong>

                    <small>
                        REDAÇÕES DA TURMA
                    </small>
                </div>

            </div>

        </div>

    </header>


    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    =================================================== -->

    <main class="literatura-main">

        <div class="literatura-container">


            <!-- ==================================================
                 TÍTULO
            =================================================== -->

            <div class="literatura-intro">

                <span>
                    LITERATURA
                </span>

                <h1>
                    Redações da turma
                </h1>

                <p>
                    Redações produzidas pelos alunos
                    durante as atividades de Literatura.
                </p>

            </div>


            <!-- ==================================================
                 LISTA DE REDAÇÕES
            =================================================== -->

            <section
                id="listaRedacoes"
                class="literatura-lista"
            >

                <div class="literatura-loading">
                    Carregando redações...
                </div>

            </section>


            <!-- ==================================================
                 BOTÃO NOVA REDAÇÃO
            =================================================== -->

            <div class="literatura-acoes">

                <button
                    id="btnNovaRedacao"
                    class="literatura-botao"
                    type="button"
                >
                    <span>+</span>
                    Nova Redação
                </button>

            </div>

        </div>

    </main>


    <!-- ==================================================
         MODAL - NOVA REDAÇÃO
    =================================================== -->

    <div
        id="modalRedacao"
        class="literatura-modal"
    >

        <div class="literatura-modal-content">

            <button
                id="fecharModal"
                class="literatura-fechar"
                type="button"
                aria-label="Fechar"
            >
                &times;
            </button>


            <h2>
                Nova Redação
            </h2>


            <form id="formRedacao">

                <label for="autor">
                    Autor
                </label>

                <input
                    type="text"
                    id="autor"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    required
                >


                <label for="texto">
                    Texto
                </label>

                <textarea
                    id="texto"
                    rows="10"
                    required
                ></textarea>


                <button
                    class="literatura-botao"
                    type="submit"
                >
                    Enviar Redação
                </button>

            </form>

        </div>

    </div>


    <!-- ==================================================
         MODAL - LEITURA
    =================================================== -->

    <div
        id="modalLeitura"
        class="literatura-modal"
    >

        <div class="literatura-modal-content literatura-leitura">

            <button
                id="fecharLeitura"
                class="literatura-fechar"
                type="button"
                aria-label="Fechar"
            >
                &times;
            </button>


            <h2
                id="tituloRedacao"
                class="titulo-redacao"
            >
            </h2>


            <div
                id="textoRedacao"
                class="texto-redacao"
            >
            </div>


            <p
                id="autorRedacao"
                class="autor-redacao"
            >
            </p>

        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        type="module"
        src="js/redacoes.js"
    ></script>

</body>

</html>
